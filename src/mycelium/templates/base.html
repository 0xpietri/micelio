<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/mycelium.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">{{ site.title }}</a>
    {% if sign_in.enabled and request.state.signed_in %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ sign_in.logout_token(request) }}">
      <button type="submit" class="link">{{ t("logout.submit") }}</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
