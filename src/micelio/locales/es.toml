sky = "Cielo"
sky_help = "Qué hay en el cielo: sol, luna, estrellas, nubes, auroras."
sky_default = "Franjas de color líquidas que se derriten y giran como aceite sobre agua, y un sol op-art de anillos concéntricos arriba a la derecha"
horizon = "Horizonte"
horizon_help = "Qué hay bajito en el horizonte: sierras, médanos, una ciudad, olas."
horizon_default = "Dos capas de montañas lejanas y una franja fina de lomas con pasto y florcitas"
underground = "Subsuelo"
underground_help = "La textura de la tierra: capas de roca, cristales, un mosaico, agua profunda."
underground_default = "Un vitral de celdas irregulares en tonos joya oscuros, separadas por gruesas líneas negras de plomo"
colors = "Colores"
colors_help = "Se completan con tu paleta. Cambialos como quieras."
mood = "Clima"
mood_help = "La sensación de la escena."
mood_default = "Alegre, onírico y un poco lisérgico, como si la tierra respirara"
template = """Ilustración de paisaje apaisada, 1536 x 1024 píxeles (3:2), para el fondo de un sitio web. Es solo un fondo: más adelante se dibujan encima hongos, hilos luminosos y texto, así que dejá lugar para eso.

ESTILO
{style}. Usá estos colores: {colors}.

CIELO (el {soil}% de arriba)
{sky}. Dejá la zona de arriba a la izquierda (0-50% a lo ancho, 0-20% hacia abajo) más tranquila y oscura para que se lea un título claro.

HORIZONTE
Una línea de horizonte apenas ondulada cruza de borde a borde exactamente al {soil}% de la altura. {horizon}. Nada alto se para sobre la línea del horizonte.

SUBSUELO (el {rest}% de abajo)
{underground}. Mantenelo oscuro y de bajo contraste, cada vez más oscuro hacia abajo, para que resalten las líneas finas y claras que se dibujan encima.

CLIMA
{mood}.

NO INCLUIR
Ni hongos, ni árboles ni raíces, ni líneas o hilos blancos bajo tierra, ni personas, ni animales, ni texto, letras, logos o marcas de agua, ni marco o borde."""

