[prompt]
title = "Make your own background"
help = "Fill in the creative parts; the format rules stay fixed so the mushrooms and the mycelium fit. Copy the prompt into any image generator (ChatGPT, Gemini, Midjourney, Stable Diffusion) and upload the image above."
fixed = "Fixed by Micelio: 1536 × 1024 (3:2), the soil line at {soil}% of the height, a calm top-left corner for the title, a dark underground, nothing standing on the horizon, no mushrooms, no text."
copy = "Copy prompt"
copied = "Copied."
copy_failed = "Select the text and copy it by hand."
output = "Your prompt"
style = "Style"
style_help = "The art style: psychedelic poster, watercolor, woodcut, pixel art, ukiyo-e…"
style_default = "1960s psychedelic concert poster meets flat vector illustration, bold black outlines, flat fills with smooth gradients"
sky = "Sky"
sky_help = "What fills the sky: sun, moon, stars, clouds, auroras."
sky_default = "Liquid, melting bands of color that swirl like oil on water, and an op-art sun made of concentric rings at the upper right"
horizon = "Horizon"
horizon_help = "What sits low on the horizon: hills, dunes, a city skyline, waves."
horizon_default = "Two layers of distant mountains and a thin strip of grassy hills with tiny flowers"
underground = "Underground"
underground_help = "The texture of the soil: rock layers, crystals, a mosaic, deep water."
underground_default = "A stained-glass mosaic of irregular cells in deep jewel tones, separated by thick black lead lines"
colors = "Colors"
colors_help = "Filled in from your palette. Change them freely."
mood = "Mood"
mood_help = "The feeling of the scene."
mood_default = "Joyful, dreamy and slightly trippy, like the ground is breathing"
template = """Wide landscape illustration, 1536 x 1024 pixels (3:2), for the background of a website. It is only a backdrop: mushrooms, glowing threads and text will be drawn on top of it later, so leave room for them.

STYLE
{style}. Use these colors: {colors}.

SKY (top {soil}%)
{sky}. Keep the top-left area (0-50% across, 0-20% down) calmer and darker so a light title stays readable there.

HORIZON
A slightly wavy horizon line runs edge to edge at exactly {soil}% of the height. {horizon}. Nothing tall stands on the horizon line.

UNDERGROUND (bottom {rest}%)
{underground}. Keep it dark and low in contrast, getting darker toward the bottom, so thin light lines drawn on top stand out.

MOOD
{mood}.

DO NOT INCLUDE
No mushrooms or fungi, no trees or roots, no white lines or threads underground, no people, no animals, no text, letters, logos or watermark, no frame or border."""

