[project]
name = "mycelium"
version = "0.1.0.dev0"
description = "Your Markdown notes as a living network of ideas: projects, graphs and links, self-hosted and read-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Pietri" }]
requires-python = ">=3.12"
keywords = ["obsidian", "markdown", "knowledge-graph", "mcp", "second-brain", "zettelkasten"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
mycelium = "mycelium.cli:main"

[project.urls]
Homepage = "https://github.com/0xpietri/mycelium"
Issues = "https://github.com/0xpietri/mycelium/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S", "C4", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["mycelium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette nudges the test client towards a newer HTTP library; httpx is fine for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["mycelium"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
