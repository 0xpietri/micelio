[project]
name = "micelio"
version = "0.1.1"
description = "Your Markdown notes as a living network of ideas: projects, graphs and links, self-hosted and read-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Pietri" }]
requires-python = ">=3.12"
keywords = ["obsidian", "markdown", "knowledge-graph", "mcp", "second-brain", "zettelkasten"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "qrcode>=8.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2.18",
    "babel>=2.16",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.scripts]
micelio = "micelio.cli:main"

[project.urls]
Homepage = "https://github.com/0xpietri/micelio"
Issues = "https://github.com/0xpietri/micelio/issues"
Changelog = "https://github.com/0xpietri/micelio/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micelio"]

# The changelog travels with the package, for the footer and /changes.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "micelio/CHANGELOG.md"

# The source archive carries what builds and tests the package, not the design files.
[tool.hatch.build.targets.sdist]
include = [
    "src/micelio",
    "tests",
    "examples",
    "micelio.example.toml",
    "compose.example.yml",
    "Dockerfile",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S", "C4", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["micelio"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette nudges the test client towards a newer HTTP library; httpx is fine for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["micelio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
